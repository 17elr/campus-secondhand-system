name: CI
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.44
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_ROOT_HOST: '%'
        ports: ['13319:3306']
        options: --health-cmd="mysqladmin ping -h127.0.0.1 -pci-root-only --silent" --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ['16379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      MARKET_DB_PASSWORD: local-campus-test
      NOTICE_DB_PASSWORD: local-notice-test
      NOTICE_INTERNAL_TOKEN: campus-test-internal-token-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Create isolated databases and users
        env: {MYSQL_PWD: ci-root-only}
        run: mysql -h127.0.0.1 -P13319 -uroot < infra/ci-databases.sql
      - run: mvn -B -ntp verify
      - run: python -m unittest discover -s scripts -p test_migration.py
      - run: node scripts/test_api.mjs
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Real Gateway, market, notice and Redis Session failure checks
        run: python scripts/smoke_services.py --keep-running
      - name: Browser regression
        run: |
          npm install --prefix tmp/browser --no-save playwright
          node tmp/browser/node_modules/playwright/cli.js install --with-deps chromium
          npm --prefix web run dev > tmp/vite.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:15173 > /dev/null && break; sleep 1; done
          node scripts/check_migration_ui.cjs "$GITHUB_WORKSPACE/tmp/browser/node_modules/playwright"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            **/target/surefire-reports/
            tmp/smoke/*.log
            tmp/smoke/result.json
            docs/screenshots/
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate private test credentials
        run: |
          python scripts/create_env.py
          sed -i 's/^MARKET_PROFILES=.*/MARKET_PROFILES=demo/' .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Verify Compose services, notice outage, MySQL persistence and Redis fail-closed
        run: python scripts/smoke_services.py --compose
      - name: Collect logs
        if: always()
        run: docker compose logs --no-color > compose-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-evidence
          path: |
            compose-test.log
            tmp/smoke/result.json
      - if: always()
        run: docker compose stop
