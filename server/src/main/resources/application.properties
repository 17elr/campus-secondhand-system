server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:18084}
spring.application.name=market-service
spring.datasource.url=${MARKET_DB_URL:jdbc:mysql://127.0.0.1:13319/market?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MARKET_DB_USER:market}
spring.datasource.password=${MARKET_DB_PASSWORD}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:16379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
spring.session.store-type=redis
spring.session.redis.namespace=market:session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
mybatis.configuration.map-underscore-to-camel-case=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
market.upload-dir=${UPLOAD_DIR:uploads}
notice.url=${NOTICE_URL:http://127.0.0.1:18085}
notice.internal-token=${NOTICE_INTERNAL_TOKEN}
spring.cloud.openfeign.client.config.notice.connectTimeout=1000
spring.cloud.openfeign.client.config.notice.readTimeout=3000
market.outbox.enabled=${OUTBOX_ENABLED:true}
mybatis.configuration.local-cache-scope=STATEMENT
