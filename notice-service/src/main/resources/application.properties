server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:18085}
spring.application.name=notice-service
spring.datasource.url=${NOTICE_DB_URL:jdbc:mysql://127.0.0.1:13319/notice?serverTimezone=Asia/Shanghai}
spring.datasource.username=${NOTICE_DB_USER:notice}
spring.datasource.password=${NOTICE_DB_PASSWORD}
spring.flyway.enabled=true
spring.sql.init.mode=never
notice.internal-token=${NOTICE_INTERNAL_TOKEN}
mybatis.configuration.map-underscore-to-camel-case=true
